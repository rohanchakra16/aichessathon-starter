[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["chess==1.11.2"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=1.18",
    "numpy>=2.5.2",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "harness"]

# The engine kernels under weights/ are numba-jitted numeric code operating on
# flat numpy arrays; per-parameter static typing there is noise, not safety.
# agent.py itself stays strict-clean.
[[tool.mypy.overrides]]
module = "weights.*"
ignore_errors = true
follow_untyped_imports = true
disallow_untyped_calls = false
